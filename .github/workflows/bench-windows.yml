name: Windows benchmark

# A hosted runner is shared virtual hardware. Keep the raw samples and
# compare both contender orders before interpreting a ratio.

on:
  workflow_dispatch:
  push:
    branches: [benchmark/windows-validation-2026-10-23]

jobs:
  bench:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install maturin aiofiles
          maturin build --release --out dist
          pip install --no-index --find-links dist urio
      - name: Compare normal and reversed contender order
        shell: pwsh
        env:
          URIO_WINDOWS_IOCP: '1'
        run: |
          $cases = @(
            @{ Label = '4k'; Files = 300; Size = 4096 },
            @{ Label = '64k'; Files = 150; Size = 65536 },
            @{ Label = '8m'; Files = 10; Size = 8388608 }
          )
          foreach ($case in $cases) {
            $common = @('--files', $case.Files, '--size', $case.Size,
              '--mode', 'both', '--no-stream', '--repeat', '7', '--warmup', '2')
            $orders = @('forward', 'reverse', 'reverse', 'forward')
            for ($i = 0; $i -lt $orders.Length; $i++) {
              $order = $orders[$i]
              $extra = @()
              if ($order -eq 'reverse') { $extra = @('--reverse-order') }
              python benchmarks/bench_vs_aiofiles.py @common @extra --json "bench-$($case.Label)-$i-$order.json"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-windows-results
          path: bench-*.json
