name: Benchmark

on:
  pull_request:
    paths:
      - .github/workflows/bench.yml
      - benchmarks/bench_vs_aiofiles.py
      - benchmarks/run_ci_benchmarks.py
  workflow_dispatch:
    inputs:
      python-version:
        description: CPython version to benchmark on every runner
        type: choice
        options: ['3.12', '3.13', '3.14', '3.15', '3.14t', '3.15t']
        default: '3.15'

permissions:
  contents: read

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-24.04
          - name: linux-arm64
            runner: ubuntu-24.04-arm
          - name: macos-intel
            runner: macos-15-intel
          - name: macos-arm64
            runner: macos-15
          - name: windows-x64
            runner: windows-2025
          - name: windows-arm64
            runner: windows-11-arm
    name: ${{ matrix.name }} / Python ${{ inputs.python-version || '3.15' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      URIO_WINDOWS_IOCP: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version || '3.15' }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and install
        shell: bash
        env:
          BENCH_PYTHON: ${{ inputs.python-version || '3.15' }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'maturin>=1.15,<2' aiofiles pytest pytest-asyncio
          if [[ "$BENCH_PYTHON" == *t ]]; then
            maturin build --release --out dist -i python
          else
            maturin build --release --out dist
          fi
          python scripts/check_wheels.py dist
          python -m pip install --no-index --find-links dist urio
      - name: Test installed build
        run: python -m pytest -q
      - name: Benchmark all workloads
        run: python benchmarks/run_ci_benchmarks.py
      - name: Upload raw samples
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: benchmark-${{ matrix.name }}-python-${{ inputs.python-version || '3.15' }}
          path: benchmark-results/*.json
          if-no-files-found: warn
          retention-days: 90
