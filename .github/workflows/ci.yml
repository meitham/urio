name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install ruff
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
          cargo fmt --check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.12', '3.13', '3.14', '3.15']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install 'maturin>=1.15,<2' pytest pytest-asyncio aiofiles
          maturin build --release --out dist
          python scripts/check_wheels.py dist
          pip install --no-index --find-links dist urio
      - name: Test
        run: pytest -q
      - name: Test (Windows IOCP backend)
        if: runner.os == 'Windows'
        env:
          URIO_WINDOWS_IOCP: '1'
        run: pytest -q -o faulthandler_timeout=120

  test-free-threaded:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.14t', '3.15t']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install 'maturin>=1.15,<2' pytest pytest-asyncio aiofiles
          maturin build --release --out dist -i python
          python scripts/check_wheels.py dist
          pip install --no-index --find-links dist urio
      - name: Test
        run: pytest -q
      - name: Test (Windows IOCP backend)
        if: runner.os == 'Windows'
        env:
          URIO_WINDOWS_IOCP: '1'
        run: pytest -q -o faulthandler_timeout=120
