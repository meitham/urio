name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff
      - name: Lint
        run: |
          ruff check .
          ruff format --check .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install
        # maturin develop needs a virtualenv, which setup-python is not —
        # build a wheel and pip-install it instead.
        run: |
          python -m pip install --upgrade pip
          pip install maturin pytest pytest-asyncio aiofiles
          maturin build --release --out dist
          pip install --no-index --find-links dist urio
      - name: Test
        run: pytest -q
      - name: Test (Windows IOCP backend)
        if: runner.os == 'Windows'
        env:
          URIO_WINDOWS_IOCP: '1'
        run: pytest -q

  test-free-threaded:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14t'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install
        # -i python: target the running free-threaded interpreter, producing a
        # cp314t wheel — free-threaded builds cannot load abi3 wheels.
        run: |
          python -m pip install --upgrade pip
          pip install maturin pytest pytest-asyncio aiofiles
          maturin build --release --out dist -i python
          pip install --no-index --find-links dist urio
      - name: Test
        run: pytest -q
      - name: Test (Windows IOCP backend)
        if: runner.os == 'Windows'
        env:
          URIO_WINDOWS_IOCP: '1'
        run: pytest -q
