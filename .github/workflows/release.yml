name: Release

# Wheels for every supported platform. abi3 wheels (one per platform) cover
# all GIL-enabled CPython >= 3.12; free-threaded interpreters cannot use abi3,
# so cp314t and cp315t wheels are built separately. Publishing runs only on version tags (vX.Y.Z)
# and refuses to proceed if the tag disagrees with Cargo.toml, the single
# source of truth for the version.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match Cargo.toml version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [ "$tag" != "$cargo_version" ]; then
            echo "tag v$tag != Cargo.toml version $cargo_version" >&2
            exit 1
          fi

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.12', '3.13', '3.14', '3.15']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and install
        run: |
          python -m pip install --upgrade pip
          pip install 'maturin>=1.15,<2' pytest pytest-asyncio
          maturin build --release --out dist
          pip install --no-index --find-links dist urio
      - run: pytest -q
      - name: Test Windows IOCP
        if: runner.os == 'Windows'
        env:
          URIO_WINDOWS_IOCP: '1'
        run: pytest -q -o faulthandler_timeout=120

  test-free-threaded:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.14t', '3.15t']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and install
        run: |
          python -m pip install --upgrade pip
          pip install 'maturin>=1.15,<2' pytest pytest-asyncio
          maturin build --release --out dist -i python
          pip install --no-index --find-links dist urio
      - run: pytest -q
      - name: Test Windows IOCP
        if: runner.os == 'Windows'
        env:
          URIO_WINDOWS_IOCP: '1'
        run: pytest -q -o faulthandler_timeout=120

  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64
            manylinux: auto
            args: --release --out dist
          # manylinux2014 (glibc 2.17) so the wheel runs on old-glibc ARM
          # boards (validated on a Jetson Nano, Ubuntu 18.04).
          - target: aarch64
            manylinux: '2014'
            args: --release --out dist --zig
          # The io-uring crate ships no 32-bit-ARM syscall bindings; the ABI
          # structs are fixed-width so the prebuilt bindings are layout-correct
          # (validated on a Raspberry Pi, armv7l).
          - target: armv7
            manylinux: '2014'
            args: --release --out dist --zig
            rustflags: --cfg io_uring_skip_arch_check
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        env:
          RUSTFLAGS: ${{ matrix.rustflags || '' }}
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  musllinux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: musllinux_1_2
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-musllinux-${{ matrix.target }}
          path: dist

  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x64, x86]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.target }}
          path: dist

  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  # Free-threaded CPython cannot load abi3 wheels, so build version-specific wheels per
  # platform. PyO3 drops the abi3 restriction automatically when compiling for
  # a free-threaded interpreter.
  free-threaded:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.14t', '3.15t']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build free-threaded wheel
        shell: bash
        run: |
          pip install 'maturin>=1.15,<2' ziglang
          if [ "$RUNNER_OS" = "Linux" ]; then
            maturin build --release --out dist -i python --zig --compatibility manylinux_2_28
          else
            maturin build --release --out dist -i python
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-freethreaded-${{ matrix.os }}-${{ matrix.python }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      [check-version, test, test-free-threaded, linux, musllinux, windows, macos, free-threaded, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # PyPI trusted publishing (OIDC) + creating the GitHub release.
      id-token: write
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
