# Read the Docs build configuration.
# The docs are pure MkDocs (handwritten API pages), so the native extension is
# not built here — only mkdocs-material is installed.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: '3.12'

mkdocs:
  configuration: mkdocs.yml

python:
  install:
    - requirements: docs/requirements.txt
