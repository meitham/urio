[package]
name = "urio"
version = "0.3.0"
edition = "2021"
description = "Real async file I/O for Python, powered by io_uring"
license = "MIT"
repository = "https://github.com/meitham/urio"
publish = false

[lib]
name = "_uring"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = [
    "extension-module",
    "abi3-py312",
    "generate-import-lib",
] }

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.7"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }

[profile.release]
lto = true
codegen-units = 1
