[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[project]
name = "urio"
# The version is dynamic: maturin takes it from Cargo.toml (the single source
# of truth). Releases are cut by tagging vX.Y.Z; the release workflow refuses
# to publish if the tag and Cargo.toml disagree.
dynamic = ["version"]
description = "Real async file I/O for Python, powered by io_uring"
authors = [
    {name = "Meitham Jamaa", email = "m@meitham.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12"
keywords = ["asyncio", "io_uring", "async", "files", "aiofiles", "pathlib"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Rust",
    "Topic :: System :: Filesystems",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/meitham/urio"
Documentation = "https://urio.readthedocs.io"
Repository = "https://github.com/meitham/urio"
Issues = "https://github.com/meitham/urio/issues"

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-asyncio>=0.23",
    "aiofiles",
    "ruff",
]
docs = [
    "mkdocs-material",
]

[tool.maturin]
python-source = "python"
module-name = "urio._uring"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["python", "tests"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
force-single-line = false
known-first-party = ["urio"]
